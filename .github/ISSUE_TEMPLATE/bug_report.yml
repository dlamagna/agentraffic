name: Bug report
description: Report a problem with agentraffic
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in as much detail as you can.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `scripts/deploy/deploy.sh`
        2. Send request with `force_structure=full_mesh`
        3. ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste container logs or error output. Use `docker compose logs <service>`.
      render: shell

  - type: textarea
    id: compose_config
    attributes:
      label: docker compose config output
      description: Run `docker compose -f infra/docker-compose.yml config` and paste the output.
      render: yaml

  - type: input
    id: gpu
    attributes:
      label: GPU / driver
      placeholder: "NVIDIA A100 / driver 550.90"

  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.11.9"

  - type: input
    id: docker
    attributes:
      label: Docker version
      placeholder: "26.1.4"
