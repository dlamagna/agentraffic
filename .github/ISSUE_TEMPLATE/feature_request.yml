name: Feature request
description: Suggest an improvement or new capability
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Feature requests are welcome. Please describe what you want and why.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the limitation or gap in the current framework.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to see added or changed?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any other approaches you have thought about?

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Orchestrator / topology
        - LLM backend
        - Monitoring / metrics
        - Experiment runner
        - UI
        - Docker / infra
        - Documentation
        - Other
    validations:
      required: true
