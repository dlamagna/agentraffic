name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  lint:
    name: Lint (black + ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install black ruff
      - run: black --check agents/ llm/
      - run: ruff check agents/ llm/

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: agents
            file: agents/Dockerfile
          - name: ui
            file: ui/Dockerfile
          - name: llm
            file: llm/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.name }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.file }}
          push: false

  compose-validate:
    name: Compose validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f infra/docker-compose.yml config > /dev/null
      - run: docker compose -f infra/docker-compose.monitoring.yml config > /dev/null

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y shellcheck
      - run: find scripts -name "*.sh" -print0 | xargs -0 shellcheck --severity=warning

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest pytest-asyncio
      - run: pytest tests/
