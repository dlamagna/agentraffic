<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Run a workflow · agentraffic</title>
  <link rel="canonical" href="../playground/run/">
  <script>
    /* Theme before first paint: the saved choice, else light (see common/js/theme.js). */
    (function () {
      var t;
      try { t = localStorage.getItem('agentraffic-theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') t = 'light';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <style>
    /* page background of the theme while redirecting (no white flash on dark) */
    :root { color-scheme: light; background: #f7f7f5; }
    :root[data-theme="dark"] { color-scheme: dark; background: #0f172a; }
  </style>
  <script>
    // Old URL (agentverse/): this page moved to playground/run/. Keep the query and hash (?replay=…, ?demo=…, #run=…).
    window.location.replace('../playground/run/' + window.location.search + window.location.hash);
  </script>
</head>
<body>
  <noscript><p>This page moved to <a href="../playground/run/">playground/run/</a>.</p></noscript>
</body>
</html>
